name: Build and Push SDK Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 2"
  workflow_dispatch:
    inputs:
      dotnet-version:
        description: "Specific .NET version to build (leave empty for all)"
        required: false
        default: ""
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false

env:
  DOCKERHUB_REPO: azhe403/dotnet-sdk-node

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ${{ inputs.dotnet-version && fromJSON(format('["{0}"]', inputs.dotnet-version)) || fromJSON('["10.0", "8.0"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Hub Login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_REPO }}
          tags: |
            type=raw,value=${{ matrix.dotnet-version }}
            type=raw,value=${{ matrix.dotnet-version }},enable={{is_default_branch}}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sdk/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          build-args: TAG=${{ matrix.dotnet-version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-latest:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sdk/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:latest
